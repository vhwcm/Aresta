<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E57B55" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF9E79" stop-opacity="0.75" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arestas (Linhas que formam a letra A em grafo) -->
  <g stroke="url(#edgeGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="7" x2="12" y2="23" />
    <line x1="12" y1="23" x2="7" y2="33" />
    <line x1="20" y1="7" x2="28" y2="23" />
    <line x1="28" y1="23" x2="33" y2="33" />
    <line x1="12" y1="23" x2="28" y2="23" stroke="#FF9E79" stroke-width="2" />
    <line x1="20" y1="7" x2="20" y2="23" stroke="#E57B55" stroke-opacity="0.35" stroke-dasharray="2 2" stroke-width="1.2" />
  </g>

  <!-- Vértices (Nós do Grafo) -->
  <g filter="url(#nodeGlow)">
    <!-- Topo -->
    <g>
      <circle cx="20" cy="7" r="3.4" fill="#0A0A0B" stroke="#E57B55" stroke-width="1.6" />
      <circle cx="20" cy="7" r="1.4" fill="#FF9E79" />
    </g>
    <!-- Meio Esquerda -->
    <g>
      <circle cx="12" cy="23" r="3" fill="#0A0A0B" stroke="#E57B55" stroke-width="1.5" />
      <circle cx="12" cy="23" r="1.2" fill="#FF9E79" />
    </g>
    <!-- Meio Direita -->
    <g>
      <circle cx="28" cy="23" r="3" fill="#0A0A0B" stroke="#E57B55" stroke-width="1.5" />
      <circle cx="28" cy="23" r="1.2" fill="#FF9E79" />
    </g>
    <!-- Base Esquerda -->
    <g>
      <circle cx="7" cy="33" r="2.6" fill="#0A0A0B" stroke="#E57B55" stroke-width="1.4" />
      <circle cx="7" cy="33" r="1" fill="#E57B55" />
    </g>
    <!-- Base Direita -->
    <g>
      <circle cx="33" cy="33" r="2.6" fill="#0A0A0B" stroke="#E57B55" stroke-width="1.4" />
      <circle cx="33" cy="33" r="1" fill="#E57B55" />
    </g>
    <!-- Centro -->
    <circle cx="20" cy="23" r="1.8" fill="#FF9E79" />
  </g>
</svg>