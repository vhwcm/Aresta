<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <!-- Fundo em tom grafite escuro com degradê sutil e elegante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <!-- Gradiente branco límpido para arestas -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EDEDED" stop-opacity="0.85" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Quadrado de Fundo com cantos arredondados elegantes -->
  <rect width="40" height="40" rx="8" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Arestas (Linhas que formam a letra A em grafo - Branco Puro Padrão) -->
  <g stroke="url(#edgeGrad)" stroke-width="1.8" stroke-linecap="round">
    <line x1="20" y1="8" x2="12.5" y2="23" />
    <line x1="12.5" y1="23" x2="8" y2="32" />
    <line x1="20" y1="8" x2="27.5" y2="23" />
    <line x1="27.5" y1="23" x2="32" y2="32" />
    <line x1="12.5" y1="23" x2="27.5" y2="23" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="20" y1="8" x2="20" y2="23" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="2 2" stroke-width="1" />
  </g>

  <!-- Vértices (Nós do Grafo - Branco Puro Padrão) -->
  <g filter="url(#nodeGlow)">
    <!-- Topo -->
    <g>
      <circle cx="20" cy="8" r="3" fill="#121315" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="20" cy="8" r="1.2" fill="#FFFFFF" />
    </g>
    <!-- Meio Esquerda -->
    <g>
      <circle cx="12.5" cy="23" r="2.7" fill="#121315" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="12.5" cy="23" r="1" fill="#FFFFFF" />
    </g>
    <!-- Meio Direita -->
    <g>
      <circle cx="27.5" cy="23" r="2.7" fill="#121315" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="27.5" cy="23" r="1" fill="#FFFFFF" />
    </g>
    <!-- Base Esquerda -->
    <g>
      <circle cx="8" cy="32" r="2.4" fill="#121315" stroke="#FFFFFF" stroke-width="1.3" />
      <circle cx="8" cy="32" r="0.9" fill="#FFFFFF" />
    </g>
    <!-- Base Direita -->
    <g>
      <circle cx="32" cy="32" r="2.4" fill="#121315" stroke="#FFFFFF" stroke-width="1.3" />
      <circle cx="32" cy="32" r="0.9" fill="#FFFFFF" />
    </g>
    <!-- Centro -->
    <circle cx="20" cy="23" r="1.6" fill="#FFFFFF" />
  </g>
</svg>