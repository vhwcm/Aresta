[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Conversor de PDF para EPUB 3 reflowable de alta fidelidade com análise de layout"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aresta Team" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "doclayout-yolo>=0.0.1"
]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
pdf2epub = "pdf2epub.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
