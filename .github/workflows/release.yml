name: Release Android APK & Desktop

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm install

      - name: Initialize Tauri Android (if needed)
        working-directory: ./apps/web
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          node scripts/copy-android-icons.mjs

      - name: Build Android APK
        working-directory: ./apps/web
        run: |
          node scripts/copy-android-icons.mjs
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi
          npx tauri android build --apk

      - name: Sign and Align APKs for Release
        run: |
          mkdir -p release-apks
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          
          # Gera uma keystore padrão de release/distribuição
          keytool -genkey -v -keystore release.keystore -alias aresta -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aresta, OU=Development, O=Aresta, L=SaoPaulo, S=SP, C=BR" \
            -storepass aresta123 -keypass aresta123

          find apps/web/src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk" | while read file; do
            raw_filename=$(basename "$file")
            clean_name=$(echo "$raw_filename" | sed 's/-unsigned//')
            aligned_apk="release-apks/aligned-${clean_name}"
            signed_apk="release-apks/Aresta-${clean_name}"

            echo "=== Processando $file ==="
            # 1. Alinha com zipalign (garante alinhamento de 4 bytes)
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$file" "$aligned_apk"

            # 2. Assina com apksigner (v2 e v3 scheme necessários para Android moderno)
            "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore \
              --ks-pass pass:aresta123 \
              --key-pass pass:aresta123 \
              --ks-key-alias aresta \
              --out "$signed_apk" "$aligned_apk"

            # 3. Valida a assinatura
            "$BUILD_TOOLS_DIR/apksigner" verify -v "$signed_apk"

            rm -f "$aligned_apk"
          done

          echo "=== APKs assinados gerados: ==="
          ls -lh release-apks/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aresta-android-apk
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Aresta ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk

