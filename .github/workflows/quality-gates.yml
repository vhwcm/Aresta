name: Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pre-commit-checks:
    name: Pre-commit Sanitization & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies for Pre-commit
        working-directory: ./apps/web
        run: npm ci

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        run: pre-commit run --all-files

  frontend-quality-gates:
    name: Frontend Quality Gates (Nuxt / Vue / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check (Tamanho & Identação)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

  backend-quality-gates:
    name: Backend Quality Gates (Express / TypeScript / Prisma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aresta
          POSTGRES_PASSWORD: arestapassword
          POSTGRES_DB: aresta
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./apps/api
    env:
      DATABASE_URL: postgresql://aresta:arestapassword@localhost:5432/aresta?schema=public
      JWT_SECRET: test_jwt_secret_quality_gates_123456789
      PORT: 3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build & Typecheck (Prisma generate + tsc)
        run: npm run build

      - name: Deploy Prisma Migrations & Seed
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Run Vitest Unit Tests
        run: npm run test
