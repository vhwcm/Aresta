name: Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pre-commit-checks:
    name: Pre-commit Sanitization & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        run: pre-commit run --all-files

  frontend-quality-gates:
    name: Frontend Quality Gates (Nuxt / Vue / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check (Tamanho & Identação)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

  backend-quality-gates:
    name: Backend Quality Gates (Java / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aresta-back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Checkstyle (Tamanho & Identação)
        run: ./gradlew checkstyleMain

      - name: Run JUnit Unit Tests
        run: ./gradlew test
