name: Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pre-commit-checks:
    name: Pre-commit Sanitization & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        run: pre-commit run --all-files

  frontend-quality-gates:
    name: Frontend Quality Gates (Nuxt / Vue / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check (Tamanho & Identação)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

  backend-quality-gates:
    name: Backend Quality Gates (Express / TypeScript / Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aresta-back-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aresta-back-node/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build & Typecheck (Prisma generate + tsc)
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm run test
