name: aresta-projeto

services:
  aresta-db:
    image: pgvector/pgvector:pg16
    container_name: aresta-db
    environment:
      POSTGRES_DB: aresta_db
      POSTGRES_USER: aresta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - aresta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aresta -d aresta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  aresta-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aresta-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://aresta:${DB_PASSWORD:-password}@aresta-db:5432/aresta_db
      JWT_SECRET: ${JWT_SECRET:-sua-chave-jwt-secreta-compartilhada}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STORAGE_PATH: /app/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
    volumes:
      - reader-storage:/app/storage
    depends_on:
      aresta-db:
        condition: service_healthy

  aresta-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3001}
        NUXT_PUBLIC_READER_API_URL: ${NUXT_PUBLIC_READER_API_URL:-http://localhost:3001}
        NUXT_PUBLIC_MEMORY_API_URL: ${NUXT_PUBLIC_MEMORY_API_URL:-http://localhost:3001}
        NUXT_PUBLIC_AI_API_URL: ${NUXT_PUBLIC_AI_API_URL:-http://localhost:3001}
        NUXT_PUBLIC_AUTH_API_URL: ${NUXT_PUBLIC_AUTH_API_URL:-http://localhost:3001}
        NUXT_PUBLIC_CANVAS_API_URL: ${NUXT_PUBLIC_CANVAS_API_URL:-http://localhost:3001}
    container_name: aresta-web
    ports:
      - "3000:80"
    depends_on:
      - aresta-api

volumes:
  aresta-db-data:
  reader-storage:
