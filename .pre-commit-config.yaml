default_install_hook_types: [pre-commit, pre-push]
exclude: '^(\.nuxt/|\.output/|apps/web/\.nuxt/|apps/web/\.output/|apps/web/playwright-report/|apps/web/test-results/|apps/web/public/|apps/web/src-tauri/gen/|apps/api/dist/|node_modules/|storage/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
        exclude: '^(\.vscode/|tsconfig.*\.json|apps/web/tsconfig.*\.json|apps/api/tsconfig.*\.json)'
      - id: check-added-large-files
        args: ['--maxkb=25000']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      # Quality Gate: Frontend Linter & Rules (Tamanho de arquivo/função, identação)
      - id: eslint-frontend
        name: "ESLint Frontend (Quality Gate: Tamanho & Identação)"
        entry: bash -c 'cd apps/web && npx eslint . --ext .js,.ts,.vue'
        language: system
        files: ^apps/web/.*\.(js|ts|vue)$
        stages: [pre-commit]

      # Quality Gate Pre-Push: Frontend Typecheck
      - id: frontend-typecheck
        name: "Frontend Typecheck (Pre-push)"
        entry: bash -c 'cd apps/web && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Quality Gate Pre-Push: Frontend Vitest Tests
      - id: frontend-tests
        name: "Frontend Unit Tests (Pre-push)"
        entry: bash -c 'cd apps/web && npm run test'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Quality Gate Pre-Push: Backend Node.js Tests
      - id: backend-tests
        name: "Backend Unit Tests (Pre-push)"
        entry: bash -c 'cd apps/api && npm run test'
        language: system
        pass_filenames: false
        stages: [pre-push]
