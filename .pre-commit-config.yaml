default_install_hook_types: [pre-commit, pre-push]
exclude: '^(\.nuxt/|\.output/|aresta-back/build/|aresta-back/\.gradle/|front/\.nuxt/|front/\.output/|front/playwright-report/|front/test-results/|node_modules/|storage/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      # Quality Gate: Frontend Linter & Rules (Tamanho de arquivo/função, identação)
      - id: eslint-frontend
        name: "ESLint Frontend (Quality Gate: Tamanho & Identação)"
        entry: bash -c 'cd front && npx eslint . --ext .js,.ts,.vue'
        language: system
        files: ^front/.*\.(js|ts|vue)$
        stages: [pre-commit]

      # Quality Gate: Backend Checkstyle (Tamanho de classe/método, identação)
      - id: checkstyle-backend
        name: "Checkstyle Backend (Quality Gate: Tamanho & Identação)"
        entry: bash -c 'if [ -z "$JAVA_HOME" ]; then for d in $HOME/Downloads/idea*/jbr /usr/lib/jvm/*; do if [ -x "$d/bin/java" ]; then export JAVA_HOME="$d"; export PATH="$JAVA_HOME/bin:$PATH"; break; fi; done; fi; cd aresta-back && ./gradlew checkstyleMain'
        language: system
        files: ^aresta-back/src/main/java/.*\.java$
        stages: [pre-commit]

      # Quality Gate Pre-Push: Frontend Typecheck
      - id: frontend-typecheck
        name: "Frontend Typecheck (Pre-push)"
        entry: bash -c 'cd front && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Quality Gate Pre-Push: Frontend Vitest Tests
      - id: frontend-tests
        name: "Frontend Unit Tests (Pre-push)"
        entry: bash -c 'cd front && npm run test'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Quality Gate Pre-Push: Backend Gradle Tests
      - id: backend-tests
        name: "Backend Unit Tests (Pre-push)"
        entry: bash -c 'if [ -z "$JAVA_HOME" ]; then for d in $HOME/Downloads/idea*/jbr /usr/lib/jvm/*; do if [ -x "$d/bin/java" ]; then export JAVA_HOME="$d"; export PATH="$JAVA_HOME/bin:$PATH"; break; fi; done; fi; cd aresta-back && ./gradlew test'
        language: system
        pass_filenames: false
        stages: [pre-push]
